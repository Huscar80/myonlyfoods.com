<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | myonlyfoods</title>
    <link rel="stylesheet" href="css/style.css?v=202610291057">
</head>
<body>
<main class="auth-body">
    <div class="auth-card">
        <img src="images/mainlogo.jpg" alt="myonlyfoods logo" class="logo">
        <h1>Reset password</h1>
        <p>Enter your email and we'll send you a link to get back into your kitchen.</p>

        <form id="resetForm" novalidate>
            <div id="message" role="status" hidden></div>
            <div class="field">
                <label for="email">Email address</label>
                <input class="input" type="email" id="email" autocomplete="email" placeholder="name@email.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
        </form>

        <div class="auth-links">
            <a href="index.html">Back to sign in</a>
        </div>
    </div>
</main>

<script type="module">
    import { auth, friendlyError } from "./js/firebase.js?v=202610291057";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const form = document.getElementById("resetForm");
    const msg = document.getElementById("message");
    const btn = document.getElementById("submitBtn");

    function show(text, ok) {
        msg.textContent = text;
        msg.className = ok ? "alert alert-ok" : "alert";
        msg.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        if (!email) return show("Please enter your email address.", false);
        btn.disabled = true;
        btn.textContent = "Sending…";
        try {
            await sendPasswordResetEmail(auth, email);
            show("If there's an account for that email, a reset link is on its way. Check your inbox (and spam folder).", true);
        } catch (err) {
            show(friendlyError(err), false);
        } finally {
            btn.disabled = false;
            btn.textContent = "Send reset link";
        }
    });
</script>
</body>
</html>
