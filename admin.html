<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin: Reports | myonlyfoods</title>
    <link rel="stylesheet" href="css/style.css?v=202611030518">
</head>
<body>
<header id="site-header"></header>

<main class="page page-narrow">
    <div id="content"><p class="loading">Loading…</p></div>
</main>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="dialog-body stack" style="gap: 14px;">
        <h2 id="confirm-title" style="margin: 0;">Take this recipe down?</h2>
        <p id="confirm-text" style="margin: 0; line-height: 1.6;"></p>
        <div class="actions">
            <button type="button" class="btn btn-danger" id="confirm-yes" style="background: var(--danger); color: #fff; border-color: var(--danger);">Take it down</button>
            <button type="button" class="btn btn-plain" id="confirm-no">Cancel</button>
        </div>
    </div>
</dialog>

<script type="module">
    import { db, requireUser, renderHeader, esc, friendlyError, toast, isAdmin } from "./js/firebase.js?v=202611030518";
    import { collection, getDocs, doc, getDoc, setDoc, deleteDoc, writeBatch, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    renderHeader("admin");
    const $ = (id) => document.getElementById(id);
    const content = $("content");
    const user = await requireUser();


    // ---------- Reports ----------
    let filter = "new";

    async function showReports() {
        content.innerHTML = `<p class="loading">Loading reports…</p>`;
        let reports, blockedIds;
        try {
            const [rSnap, bSnap] = await Promise.all([
                getDocs(query(collection(db, "reports"), orderBy("createdAt", "desc"))),
                getDocs(collection(db, "blocked")),
            ]);
            reports = rSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
            blockedIds = new Set(bSnap.docs.map((d) => d.id));
        } catch (err) {
            content.innerHTML = `<div class="alert" role="alert">${esc(friendlyError(err))} If you just became an admin, make sure the latest Firestore rules are published.</div>`;
            return;
        }

        // Group by recipe so several reports on one recipe show together.
        const groups = new Map();
        reports.forEach((r) => {
            if (!groups.has(r.recipeId)) groups.set(r.recipeId, { recipeId: r.recipeId, title: r.recipeTitle, owner: r.ownerName, ownerId: r.ownerId, reports: [] });
            groups.get(r.recipeId).reports.push(r);
        });
        const all = [...groups.values()].map((g) => ({
            ...g,
            open: g.reports.filter((r) => r.status === "new").length,
            blocked: blockedIds.has(g.recipeId),
            latest: Math.max(...g.reports.map((r) => toDate(r.createdAt).getTime())),
        })).sort((a, b) => (b.open > 0) - (a.open > 0) || b.latest - a.latest);

        const openCount = all.filter((g) => g.open > 0).length;
        const shown = filter === "new" ? all.filter((g) => g.open > 0) : all;

        content.innerHTML = `
          <div class="page-head">
            <div>
              <h1 class="page-title">Reports</h1>
              <p class="subtle">${openCount ? `${openCount} recipe${openCount === 1 ? "" : "s"} need${openCount === 1 ? "s" : ""} review` : "Nothing needs review right now"} · ${reports.length} report${reports.length === 1 ? "" : "s"} in total</p>
            </div>
            <button class="btn btn-secondary" type="button" id="refresh">Refresh</button>
          </div>
          <div class="tabs" role="tablist" aria-label="Which reports">
            <button class="tab" role="tab" data-filter="new" aria-selected="${filter === "new"}">Needs review<span class="badge" ${openCount ? "" : "hidden"}>${openCount}</span></button>
            <button class="tab" role="tab" data-filter="all" aria-selected="${filter === "all"}">All reports</button>
          </div>
          <div class="stack" id="groups" style="gap: 16px;">
            ${shown.length ? shown.map(groupHtml).join("") : `<div class="empty"><p style="margin: 0;">${filter === "new" ? "No reports waiting. All clear!" : "No reports yet."}</p></div>`}
          </div>`;

        $("refresh").addEventListener("click", showReports);
        content.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.filter; showReports(); }));
        content.querySelectorAll("[data-dismiss]").forEach((b) => b.addEventListener("click", () => dismiss(all.find((g) => g.recipeId === b.dataset.dismiss))));
        content.querySelectorAll("[data-takedown]").forEach((b) => b.addEventListener("click", () => askTakeDown(all.find((g) => g.recipeId === b.dataset.takedown))));
        content.querySelectorAll("[data-restore]").forEach((b) => b.addEventListener("click", () => restore(all.find((g) => g.recipeId === b.dataset.restore))));
    }

    function toDate(v) {
        if (!v) return new Date(0);
        return typeof v.toDate === "function" ? v.toDate() : new Date(v);
    }
    const when = (v) => toDate(v).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    const STATUS = { new: ["Needs review", "badge-sale"], dismissed: ["Dismissed", "badge-private"], removed: ["Taken down", "badge-private"] };

    function groupHtml(g) {
        const state = g.blocked
            ? `<span class="badge badge-private">Taken down</span>`
            : `<span class="badge badge-public">Still shared</span>`;
        const actions = [];
        actions.push(g.blocked
            ? `<span class="help">Recipe is no longer public.</span>`
            : `<a class="btn btn-secondary" href="recipe.html?pub=${encodeURIComponent(g.recipeId)}" target="_blank" rel="noopener">View recipe</a>`);
        if (g.open && !g.blocked) actions.push(`<button class="btn btn-plain" type="button" data-dismiss="${esc(g.recipeId)}">Dismiss (it's fine)</button>`);
        if (!g.blocked) actions.push(`<button class="btn btn-danger" type="button" data-takedown="${esc(g.recipeId)}">Take recipe down</button>`);
        if (g.blocked) actions.push(`<button class="btn btn-plain" type="button" data-restore="${esc(g.recipeId)}">Allow sharing again</button>`);

        return `
          <article class="card report-group${g.open ? " open" : ""}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
              <div style="min-width: 0;">
                <h2 style="margin: 0 0 4px;">${esc(g.title || "Untitled recipe")}</h2>
                <p class="help" style="font-size: 14px;">Shared by <strong>${esc(g.owner || "unknown")}</strong> · ${g.reports.length} report${g.reports.length === 1 ? "" : "s"}</p>
              </div>
              ${state}
            </div>
            <ul class="report-list">
              ${g.reports.map((r) => {
                  const [label, cls] = STATUS[r.status] || STATUS.new;
                  return `<li>
                    <div class="report-top"><strong>${esc(r.reason || "No reason")}</strong><span class="badge ${cls}">${label}</span></div>
                    ${r.details ? `<p class="report-details">"${esc(r.details)}"</p>` : ""}
                    <p class="help">From ${esc(r.reporterEmail || "a signed-in user")} · ${esc(when(r.createdAt))}</p>
                  </li>`;
              }).join("")}
            </ul>
            <div class="actions">${actions.join("")}</div>
          </article>`;
    }

    async function setStatus(g, status) {
        const batch = writeBatch(db);
        g.reports.filter((r) => r.status === "new" || status === "removed").forEach((r) =>
            batch.update(doc(db, "reports", r.id), { status, reviewedAt: new Date(), reviewedBy: user.uid }));
        await batch.commit();
    }

    async function dismiss(g) {
        try {
            await setStatus(g, "dismissed");
            toast(`Dismissed reports on "${g.title}"`);
            showReports();
        } catch (err) { toast(friendlyError(err)); }
    }

    function askTakeDown(g) {
        $("confirm-text").textContent = `"${g.title || "This recipe"}" will be removed from public sharing right away, and ${g.owner || "the cook"} won't be able to share it again unless you allow it. It stays private in their own book, and copies other people already saved aren't affected.`;
        const dlg = $("confirm-dialog");
        dlg.showModal();
        $("confirm-yes").onclick = async () => {
            dlg.close();
            try {
                await setDoc(doc(db, "blocked", g.recipeId), {
                    ownerId: g.ownerId || "", title: g.title || "", takenDownAt: new Date(), by: user.uid,
                });
                await deleteDoc(doc(db, "publicRecipes", g.recipeId)).catch(() => {});
                await setStatus(g, "removed");
                toast(`"${g.title}" was taken down`);
                showReports();
            } catch (err) { toast(friendlyError(err)); }
        };
        $("confirm-no").onclick = () => dlg.close();
    }

    async function restore(g) {
        try {
            await deleteDoc(doc(db, "blocked", g.recipeId));
            toast(`${g.owner || "The cook"} can share "${g.title}" again by saving it as Public.`);
            showReports();
        } catch (err) { toast(friendlyError(err)); }
    }

    // Only admins can use this page; everyone else goes to their Home page.
    // (This runs last so everything above is set up first.)
    if (!(await isAdmin(user))) {
        window.location.replace("home.html");
    } else {
        await showReports();
    }
</script>
</body>
</html>
