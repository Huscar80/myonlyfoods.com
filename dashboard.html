<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipe Book | myonlyfoods</title>
    <link rel="stylesheet" href="css/style.css?v=202610291048">
</head>
<body>
<header id="site-header"></header>

<main class="page">
    <div class="page-head">
        <div>
            <h1 class="page-title" id="greeting">My Recipe Book</h1>
            <p class="subtle" id="summary">Loading your recipes…</p>
        </div>
        <div style="flex: 0 1 340px; min-width: 220px;">
            <label for="search" class="sr-only">Search your recipes</label>
            <div class="search-box">
                <span id="search-icon"></span>
                <input id="search" type="search" placeholder="Search your recipes">
            </div>
        </div>
    </div>

    <div class="split">
        <aside class="side card" aria-labelledby="col-h" style="padding: 18px;">
            <h2 id="col-h" class="eyebrow" style="font-family: var(--sans); font-size: 12px; color: var(--muted); margin: 0 0 10px;">Collections</h2>
            <div class="collections" id="collections"></div>
            <p class="help" style="margin-top: 10px;">Add recipes to a collection when you edit them.</p>
        </aside>

        <section class="main" aria-label="Recipes">
            <div class="pills" role="group" aria-label="Filter by meal type" id="pills"></div>
            <div id="list" class="recipe-grid"><p class="loading">Loading…</p></div>
        </section>
    </div>
</main>

<script type="module">
    import { db, requireUser, renderHeader, esc, icons, photoHtml, normalizeRecipe, totalTime, visibilityBadge, friendlyError, likeCount, likePill } from "./js/firebase.js?v=202610291048";
    import { collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    renderHeader("recipes");
    document.getElementById("search-icon").outerHTML = icons.search;

    const state = { recipes: [], category: "All", collection: "", query: "" };
    const likes = {};   // recipe id -> like count, for your Public recipes
    const user = await requireUser();

    // Greet by name if we have one.
    getDoc(doc(db, "profiles", user.uid)).then((snap) => {
        const name = (snap.data() && snap.data().name) || user.displayName;
        if (name) document.getElementById("greeting").textContent = `${name.split(" ")[0]}'s Recipe Book`;
    }).catch(() => {});

    onSnapshot(collection(db, "profiles", user.uid, "recipes"), (snap) => {
        state.recipes = snap.docs
            .map((d) => normalizeRecipe(d.id, d.data()))
            .sort((a, b) => a.title.localeCompare(b.title));
        render();
        // Fetch like counts for Public recipes, then redraw once they're in.
        const pub = state.recipes.filter((r) => r.visibility === "public" && likes[r.id] === undefined);
        if (pub.length) Promise.all(pub.map((r) => likeCount(r.id).then((n) => { likes[r.id] = n; }).catch(() => { likes[r.id] = 0; })))
            .then(renderList);
    }, (err) => {
        document.getElementById("list").innerHTML = `<div class="alert" role="alert">${esc(friendlyError(err))}</div>`;
        document.getElementById("summary").textContent = "";
    });

    document.getElementById("search").addEventListener("input", (e) => {
        state.query = e.target.value.trim().toLowerCase();
        renderList();
    });

    function render() {
        const n = state.recipes.length;
        const colNames = [...new Set(state.recipes.flatMap((r) => r.collections))].sort();
        if (state.collection && !colNames.includes(state.collection)) state.collection = "";
        document.getElementById("summary").textContent =
            `${n} recipe${n === 1 ? "" : "s"}` + (colNames.length ? ` · ${colNames.length} collection${colNames.length === 1 ? "" : "s"}` : "");

        // Collections sidebar
        const colEl = document.getElementById("collections");
        const colButton = (label, value, count) =>
            `<button type="button" data-col="${esc(value)}" aria-pressed="${state.collection === value}"><span>${esc(label)}</span><span class="count">${count}</span></button>`;
        colEl.innerHTML = colButton("All recipes", "", n) +
            colNames.map((c) => colButton(c, c, state.recipes.filter((r) => r.collections.includes(c)).length)).join("");
        colEl.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
            state.collection = b.dataset.col;
            render();
        }));

        // Meal type pills — only show the types you actually use.
        const cats = ["All", ...new Set(state.recipes.map((r) => r.category))];
        if (!cats.includes(state.category)) state.category = "All";
        const pillsEl = document.getElementById("pills");
        pillsEl.innerHTML = cats.map((c) => `<button type="button" class="pill" data-cat="${esc(c)}" aria-pressed="${state.category === c}">${esc(c)}</button>`).join("");
        pillsEl.hidden = state.recipes.length === 0;
        pillsEl.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
            state.category = b.dataset.cat;
            render();
        }));

        renderList();
    }

    function renderList() {
        const list = document.getElementById("list");
        if (state.recipes.length === 0) {
            list.style.display = "block";
            list.innerHTML = `
              <div class="empty">
                <h2>Your recipe book is empty</h2>
                <p>Add the first recipe you'd want to pass down.</p>
                <a class="btn btn-primary" href="editor.html">${icons.plus}Add your first recipe</a>
              </div>`;
            return;
        }
        const q = state.query;
        const shown = state.recipes.filter((r) =>
            (state.category === "All" || r.category === state.category) &&
            (!state.collection || r.collections.includes(state.collection)) &&
            (!q || r.title.toLowerCase().includes(q) || r.ingredients.join(" ").toLowerCase().includes(q))
        );
        if (shown.length === 0) {
            list.style.display = "block";
            list.innerHTML = `<div class="empty"><p>No recipes match. Try a different search or filter.</p></div>`;
            return;
        }
        list.style.display = "";
        list.innerHTML = shown.map((r) => {
            const time = totalTime(r);
            const meta = [time, r.servings ? `Serves ${r.servings}` : ""].filter(Boolean).join(" · ");
            const sub = r.subCategory ? ` · ${esc(r.subCategory)}` : "";
            return `
              <a class="recipe-card" href="recipe.html?id=${encodeURIComponent(r.id)}">
                <div class="photo">${photoHtml(r.photoURL, "")}</div>
                <div class="body">
                  <span class="eyebrow">${esc(r.category)}${sub}</span>
                  <h3>${esc(r.title)}</h3>
                  <div class="meta"><span>${esc(meta)}</span><span style="display:flex; gap:6px; align-items:center;">${r.visibility === "public" && likes[r.id] ? likePill(likes[r.id], true) : ""}${visibilityBadge(r)}</span></div>
                </div>
              </a>`;
        }).join("");
    }
</script>
</body>
</html>
