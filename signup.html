<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | myonlyfoods</title>
    <link rel="stylesheet" href="css/style.css?v=202610292323">
</head>
<body>
<main class="auth-body">
    <div class="auth-card">
        <a href="index.html" aria-label="myonlyfoods home"><img src="images/mainlogo.jpg" alt="" class="logo"></a>
        <h1>Join the table</h1>
        <p>Create a free account and start your recipe book.</p>

        <form id="signupForm" novalidate>
            <div id="error" class="alert" role="alert" hidden></div>
            <div class="field">
                <label for="fullname">Your name</label>
                <input class="input" type="text" id="fullname" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input class="input" type="email" id="email" autocomplete="email" placeholder="name@email.com" required>
            </div>
            <div class="field">
                <label for="password">Create a password</label>
                <input class="input" type="password" id="password" autocomplete="new-password" required aria-describedby="pw-help">
                <p class="help" id="pw-help">At least 6 characters.</p>
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input class="input" type="password" id="confirm" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
        </form>

        <div class="auth-links">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
</main>

<script type="module">
    import { auth, db, friendlyError } from "./js/firebase.js?v=202610292323";
    import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const form = document.getElementById("signupForm");
    const errorBox = document.getElementById("error");
    const btn = document.getElementById("submitBtn");

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.hidden = true;
        const name = document.getElementById("fullname").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (!name || !email || !password) return showError("Please fill in every field.");
        if (password.length < 6) return showError("Please use a password with at least 6 characters.");
        if (password !== confirm) return showError("The two passwords don't match.");

        btn.disabled = true;
        btn.textContent = "Creating your account…";
        try {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(cred.user, { displayName: name });
            try {
                await setDoc(doc(db, "profiles", cred.user.uid), { name, createdAt: new Date() }, { merge: true });
            } catch (profileErr) {
                // The account exists either way; the name can be added later on the Profile page.
                console.warn("Profile not saved:", profileErr);
            }
            window.location.replace("home.html");
        } catch (err) {
            showError(friendlyError(err));
            btn.disabled = false;
            btn.textContent = "Create account";
        }
    });
</script>
</body>
</html>
